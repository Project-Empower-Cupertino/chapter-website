  <body>

    <div>
      <link href="./join-us.css" rel="stylesheet" />

      <div class="join-us-container">
        <navbar4-wrapper class="navbar4-wrapper">
          <!--Navbar4 component-->
          <header class="navbar4-container">
            <header data-thq="thq-navbar" class="navbar4-navbar-interactive">

              />
              <div data-thq="thq-navbar-nav" class="navbar4-desktop-menu">
                <nav class="navbar4-links1">
                  <a
                    href="index.html"
                    class="navbar4-link11 thq-link thq-body-small"
                  >
                    <span>Home</span>
                  </a>
                  <a
                    href="ourteam.html"
                    class="navbar4-link41 thq-link thq-body-small"
                  >
                    <span>Our Team</span>
                  </a>
                  <a
                    href="join-us.html"
                    class="navbar4-link31 thq-link thq-body-small"
                  >
                    <span>Join Us</span>
                  </a>
                  <a
                    href="mailto:projectempowercup@gmail.com?subject="
                    class="navbar4-link21 thq-link thq-body-small"
                  >
                    <span>Contact Us</span>
                  </a>
                </nav>
                <div class="navbar4-buttons1">
                  <button
                    class="navbar4-action11 thq-button-animated thq-button-filled"
                  >
                    <span class="thq-body-small">Donate</span>
                  </button>
                </div>
              </div>
              <div data-thq="thq-burger-menu" class="navbar4-burger-menu">
                <svg viewBox="0 0 1024 1024" class="navbar4-icon1">

                  ></path>
                </svg>
              </div>
              <div data-thq="thq-mobile-menu" class="navbar4-mobile-menu">
                <div class="navbar4-nav">
                  <div class="navbar4-top">
                    <img
                      alt="logo"
                      src="https://aheioqhobo.cloudimg.io/v7/_playground-bucket-v2.teleporthq.io_/84ec08e8-34e9-42c7-9445-d2806d156403/fac575ac-7a41-484f-b7ac-875042de11f8?org_if_sml=1&amp;force_format=original"
                      class="navbar4-logo"

                          d="M810 274l-238 238 238 238-60 60-238-238-238 238-60-60 238-238-238-238 60-60 238 238 238-238z"

                    </span>

                <div class="navbar4-buttons2">
                  <button class="thq-button-filled">Login</button>
                  <button class="thq-button-outline">Register</button>
                </div>
              </div>
            </header>
          </header>
        </navbar4-wrapper>
        <contact-form5-wrapper class="contact-form5-wrapper">
          <!--ContactForm5 component-->
          <div class="contact-form5-contact1 thq-section-padding">
            <div class="thq-flex-column thq-section-max-width">
              <div class="contact-form5-section-title thq-flex-column">
                <div class="contact-form5-content">
                  <h2>
                    <fragment class="join-us-fragment2">
                      <span class="join-us-text2 thq-heading-2">Join Us</span>
                    </fragment>
                  </h2>
                  <span>
                    <fragment class="join-us-fragment1">
                      <span class="join-us-text1 thq-body-small">
                        Fill out this form to get in touch with us and join the
                        team!
                      </span>
                    </fragment>
                  </span>
                </div>
              </div>
              <form class="contact-form5-form thq-flex-column">
                <div class="contact-form5-container1">
                  <div class="contact-form5-input1">
                    <label
                      for="contact-form-5-first-name"
                      class="thq-body-small"
                    >
                      First name
                    </label>
                    <input
                      type="text"
                      id="contact-form-5-first-name"
                      placeholder="First Name"
                      class="thq-input"
                    />
                  </div>
                  <div class="contact-form5-input2">
                    <label
                      for="contact-form-5-last-name"
                      class="thq-body-small"
                    >
                      Last name
                    </label>
                    <input
                      type="text"
                      id="contact-form-5-last-name"
                      placeholder="Last Name"
                      class="thq-input"
                    />
                  </div>
                </div>
                <div class="contact-form5-container2">
                  <div class="contact-form5-input3">
                    <label for="contact-form-5-email" class="thq-body-small">
                      Email
                    </label>
                    <input
                      type="email"
                      id="contact-form-5-email"
                      required="true"
                      placeholder="Email"
                      class="thq-input"
                    />
                  </div>
                  <div class="contact-form5-input4">
                    <label for="contact-form-5-phone" class="thq-body-small">
                      Phone Number
                    </label>
                    <input
                      type="tel"
                      id="contact-form-5-phone"
                      placeholder="Phone Number"
                      class="thq-input"
                    />
                  </div>
                </div>
                <div class="contact-form5-container3">
                  <div class="contact-form5-input5">
                    <label for="contact-form-5-options" class="thq-body-small">
                      What group do you want to join?
                    </label>
                    <select
                      id="contact-form-5-options"
                      placeholder="Select one"
                      class="thq-select"
                    >
                      <option value="Option 1">Frontend Developer</option>
                      <option value="Option 2">Backend Developer</option>
                    </select>
                  </div>
                </div>
                <div class="contact-form5-container4">
                  <label for="contact-form-5-message" class="thq-body-small">
                    Why do you want to join?
                  </label>
                  <textarea
                    id="contact-form-5-message"
                    rows="3"
                    placeholder="Enter your message"
                    class="thq-input contact-form5-textarea"
                  ></textarea>
                </div>
                <div class="contact-form5-checkbox"></div>
                <button
                  type="submit"
                  class="contact-form5-button thq-button-filled"
                >
                  <span>
                    <fragment class="join-us-fragment3">
                      <span class="join-us-text3 thq-body-small">Submit</span>
                    </fragment>
                  </span>
                </button>
              </form>
            </div>
          </div>
        </contact-form5-wrapper>
      </div>
    </div>
    <script
      defer=""
      src="https://unpkg.com/@teleporthq/teleport-custom-scripts"
    ></script>
  </body>
